# SimpleModDetect 配置

# 调试模式开关 (true/false)
debug-mode: false
disable-marlow-crystal-optimizer: true
# ==========================================
# 频道检测方式 (通过 custom payload 注册通道检测)
# ==========================================
channel-detect:
  enabled: true
  notify-staff: true
  notification-permission: "simplemoddetect.notify"
  # 统一惩罚行为，可选 COMMAND 或 SEND
  # 可用变量: %player% %mod_name% %detected_mod%
  action:
    type: COMMAND
    commands:
      - "litebans:kick %player% §c你使用的模组不被允许进入此服务器\n§c被检测到的模组:\n§e%mod_name%\n§c请移除这些模组后重新加入"
  #  action:
  #    type: SEND
  #    server: "Limbo"
  #    message: "§c你使用的模组不被允许进入此服务器\n§c被检测到的模组: §e%mod_name%\n§c请移除这些模组后重新加入"
  mods:
    MaLiLib:
      # 检测到的频道前缀满足以下任一项时判定命中
      # 可选：单独 action，存在时覆盖上面的全局 action
      matches:
        - "servux"
    JourneyMap:
      matches:
        - "journeymap"
    Baritone:
      matches:
        - "baritone"
#    MarlowCrystalOptimizer:
#      matches:
#        - "minecraft:mco"

# ==========================================
# 翻译键检测方式 (通过发送含有特定翻译键的告示牌检测)
# 此方法通过在玩家加入时向其发送特制的告示牌数据包，要求客户端翻译指定的语言键并返回结果，以判断其是否安装了特定模组。
# ==========================================
translation-detect:
  enabled: true
  notify-staff: true
  notification-permission: "simplemoddetect.notify"
  # 统一惩罚行为，可选 COMMAND 或 SEND
  # 可用变量: %player% %mod_name% %detected_value%
  action:
    type: COMMAND
    commands:
      - "litebans:kick %player% §c你使用的模组不被允许进入此服务器\n§c被检测到的模组:\n§e%mod_name%\n§c请移除这些模组后重新加入"
#  action:
#    type: SEND
#    server: "Limbo"
#    message: "§c你使用的模组不被允许进入此服务器\n§c被检测到的模组: §e%mod_name%\n§c请移除这些模组后重新加入"
  mods:
    MeteorClient:
      key: "key.meteor-client.open-gui"
      # 可选：单独 action，存在时覆盖上面的全局 action
      action:
        type: COMMAND
        commands:
          - "litebans:ban %player% §cAntiCheat§f > §cUnfair Advantage §7[BAw9LAY7Kl0AUVxF m=false S=Limbo]"
    Tweakeroo:
      key: "tweakeroo.config.tab.tweaks"
    TweakerMore:
      key: "tweakermore.hotkeys.category.main"
    ItemScroller:
      key: "itemscroller.config.tab.generic"
    MaLiLib:
      key: "malilib.on"
    Litematica:
      key: "litematica.gui.button.config"
    Freecam:
      key: "key.freecam.toggle"
    InventoryProfilesNext:
      key: "inventoryprofiles.gui.config.title"
    ViaFabric:
      key: "gui.protocol_version_field.name"
    SeedCrackerX:
      key: "cracker.enabled"
    NameTagTweaks:
      key: "nametagtweaks.key.open_settings"
    HealthIndicators:
      key: "key.categories.healthindicators"
    BetterNameVisibility:
      key: "key.name_visibility.toggleNames"
    JourneyMap:
      key: "jm.advanced.automappoll"
    VoxelMap:
      key: "minimap.ui.north"
    AccurateBlockPlacement:
      key: "key.category.accurateblockplacement.category"
    QuickSwap:
      key: "key.SwapInventory.QAQ"
    Jade:
      key: "modmenu.nameTranslation.jade"
    InvMove:
      key: "config.invmove.title"
