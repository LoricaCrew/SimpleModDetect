# SimpleModDetect 配置

# 调试模式开关 (true/false)
debug-mode: false
disable-marlow-crystal-optimizer: true
# ==========================================
# 频道检测方式 (通过 custom payload 注册通道检测)
# ==========================================
channel-detect:
  enabled: true
  notify-staff: true
  notification-permission: "simplemoddetect.notify"
  action:
    # 统一惩罚行为，可选 COMMAND 或 SEND
    type: COMMAND
    # 可用变量: %player% %mod_name% %detected_mod%
    commands:
      - "litebans:ban %player% 1m §c你使用的模组不被允许进入此服务器\n§c被检测到的模组:\n§e%mod_name%\n§c请移除这些模组后重新加入"
  #  action:
  #    type: SEND
  #    server: "Limbo"
  #    message: "§c你使用的模组不被允许进入此服务器\n§c被检测到的模组: §e%mod_name%\n§c请移除这些模组后重新加入"
  mods:
    MaLiLib:
      # 检测到的频道前缀满足以下任一项时判定命中
      # 可选：单独 action，存在时覆盖上面的全局 action
      matches:
        - "servux"
    JourneyMap:
      matches:
        - "journeymap"
    Baritone:
      matches:
        - "baritone"
    AutoTotem:
      matches:
        - "autototem"
#    MarlowCrystalOptimizer:
#      matches:
#        - "minecraft:mco"

# ==========================================
# 翻译键检测方式 (通过发送含有特定翻译键的告示牌检测)
# 此方法通过在玩家加入时向其发送特制的告示牌数据包，要求客户端翻译指定的语言键并返回结果，以判断其是否安装了特定模组。
# ==========================================
translation-detect:
  enabled: true
  notify-staff: true
  notification-permission: "simplemoddetect.notify"
  batch:
    # 每行合并多少个翻译键进行检测
    # 实际每次木牌最多会检测 4 行，因此单次总量约为 4 * 此值
    # 值过大可能接近客户端木牌单行长度限制，插件会按估算长度自动提前换行
    mods-per-line: 3
  timing:
    # 玩家加入后等待多久再开始木牌检测
    initial-check-delay-ticks: 10
    # 发送木牌内容后，延迟多久再打开木牌编辑界面
    open-sign-delay-ticks: 1
    # 一批木牌回包处理完成后，等待多久再发送下一批
    next-batch-delay-ticks: 1
  action:
    # 统一惩罚行为，可选 COMMAND 或 SEND
    type: COMMAND
    # 可用变量: %player% %mod_name% %detected_value%
    commands:
      - "litebans:ban %player% 1m §c你使用的模组不被允许进入此服务器\n§c被检测到的模组:\n§e%mod_name%\n§c请移除这些模组后重新加入"
  # action:
  #   type: SEND
  #   server: "Limbo"
  #   message: "§c你使用的模组不被允许进入此服务器\n§c被检测到的模组: §e%mod_name%\n§c请移除这些模组后重新加入"
  mods:
    MeteorClient:
      key: "key.meteor-client.open-gui"
      # 可选：单独 action，存在时覆盖上面的全局 action
      # action:
      #   type: SEND
      #   server: "Limbo"
      #   message: "§c检测到 %mod_name%，你已被传送至审核服。"
      action:
        type: COMMAND
        commands:
          - "litebans:ban %player% §cAntiCheat§f > §cUnfair Advantage §7[BAw9LAY7IVAR m=false S=Limbo]"
    Tweakeroo:
      key: "tweakeroo.config.tab.tweaks"
    TweakerMore:
      key: "tweakermore.hotkeys.category.main"
    ItemScroller:
      key: "itemscroller.config.tab.generic"
    MaLiLib:
      key: "malilib.on"
    Litematica:
      key: "litematica.gui.button.config"
    Freecam:
      key: "key.freecam.toggle"
    InventoryProfilesNext:
      key: "inventoryprofiles.gui.config.title"
    ViaFabric:
      key: "gui.protocol_version_field.name"
